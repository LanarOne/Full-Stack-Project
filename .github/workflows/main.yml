name: Test

on: push

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      DATABASE_URL: ${{secrets.DATABASE_URL}}
      TOKEN_KEY: ${{secrets.TOKEN_KEY}}
      TEST_DATABASE_URL: ${{vars.TEST_DATABASE_URL}}
      TOKEN_EXPIRES_IN: ${{vars.TOKEN_EXPIRES_IN}}
      PASSWORD_COST: ${{secrets.PASSWORD_COST}}
      TRPC_ROUTE: ${{secrets.TRPC_ROUTE}}
      COOKIE_NAME: ${{secrets.COOKIE_NAME}}


    services:
      postgres:
        image: postgres:16.1-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: household_app
        ports:
            - 5432:5432

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Type check server
        run: npm run typecheck -w server

      - name: Lint server
        run: npm run lint -w server

      - name: Lint client
        run: npm run lint -w client

      - name: Run migrations
        run: npm run migrate:latest -w server

      - name: Run server tests
        run: npm run test -w server

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build front end for E2E tests
        run: npm run build -w client

      - name: Test client E2E
        run: npm run test:e2e -w client

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  build-deploy:
    needs: test
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    env:
      CLIENT_IMAGE_TAG: client
      SERVER_IMAGE_TAG: server

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{vars.AWS_REGION}}
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}

      - name: Install Lightsail CLI helper
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          sudo curl "https://s3.us-west-2.amazonaws.com/lightsailctl/linux-amd64/lightsailctl" -o "/usr/local/bin/lightsailctl"
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Debug commit
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          git log -1 --oneline

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build server image
        run: docker build -t server:${GITHUB_SHA} -f ./server/Dockerfile .

      - name: Build client image
        run: docker build --build-arg VITE_API_PATH=${{vars.VITE_API_PATH}} -t client:${GITHUB_SHA} -f ./client/Dockerfile .

      - name: Push server image
        run: |
          set -euo pipefail
          aws lightsail push-container-image \
            --region "$AWS_REGION" \
            --service-name "${{ vars.AWS_LIGHTSAIL_SERVICE }}" \
            --label "$SERVER_IMAGE_TAG" \
            --image "server:${GITHUB_SHA}" \
            2>&1 | tee push-server.log
          echo "---- push-server.log ----"
          cat push-server.log

      - name: Show registered images after server push
        run: |
          aws lightsail get-container-images \
            --region "$AWS_REGION" \
            --service-name "${{ vars.AWS_LIGHTSAIL_SERVICE }}" \
            --output json

      - name: Push client image
        run: |
          set -euo pipefail
          aws lightsail push-container-image \
            --region "$AWS_REGION" \
            --service-name "${{ vars.AWS_LIGHTSAIL_SERVICE }}" \
            --label "$CLIENT_IMAGE_TAG" \
            --image "client:${GITHUB_SHA}" \
            2>&1 | tee push-client.log
          echo "---- push-client.log ----"
          cat push-client.log

      - name: Show registered images after client push
        run: |
          aws lightsail get-container-images \
            --region "$AWS_REGION" \
            --service-name "${{ vars.AWS_LIGHTSAIL_SERVICE }}" \
            --output json
          
      - name: Resolve pushed image refs
        id: resolve_images
        run: |
          BEFORE_JSON=$(aws lightsail get-container-images \
            --region "$AWS_REGION" \
            --service-name "${{ vars.AWS_LIGHTSAIL_SERVICE }}" \
            --output json)
      
          echo "$BEFORE_JSON" > before-images.json
      
          BEFORE_SERVER=$(jq -r '
            .containerImages
            | map(select(.image | test("^:" + "${{ vars.AWS_LIGHTSAIL_SERVICE }}" + "\\.server\\.")))
            | sort_by(.createdAt)
            | last
            | .image
          ' before-images.json)
      
          BEFORE_CLIENT=$(jq -r '
            .containerImages
            | map(select(.image | test("^:" + "${{ vars.AWS_LIGHTSAIL_SERVICE }}" + "\\.client\\.")))
            | sort_by(.createdAt)
            | last
            | .image
          ' before-images.json)
      
          echo "BEFORE_SERVER=$BEFORE_SERVER"
          echo "BEFORE_CLIENT=$BEFORE_CLIENT"
      
          for i in {1..20}; do
            IMAGES_JSON=$(aws lightsail get-container-images \
              --region "$AWS_REGION" \
              --service-name "${{ vars.AWS_LIGHTSAIL_SERVICE }}" \
              --output json)
      
            echo "$IMAGES_JSON" > images.json
      
            SERVER_IMAGE=$(jq -r '
              .containerImages
              | map(select(.image | test("^:" + "${{ vars.AWS_LIGHTSAIL_SERVICE }}" + "\\.server\\.")))
              | sort_by(.createdAt)
              | last
              | .image
            ' images.json)
      
            CLIENT_IMAGE=$(jq -r '
              .containerImages
              | map(select(.image | test("^:" + "${{ vars.AWS_LIGHTSAIL_SERVICE }}" + "\\.client\\.")))
              | sort_by(.createdAt)
              | last
              | .image
            ' images.json)
      
            echo "Attempt $i: server=$SERVER_IMAGE client=$CLIENT_IMAGE"
      
            if [ "$SERVER_IMAGE" != "$BEFORE_SERVER" ] && [ "$CLIENT_IMAGE" != "$BEFORE_CLIENT" ]; then
              break
            fi
      
            sleep 10
          done
      
          test -n "$SERVER_IMAGE" && test "$SERVER_IMAGE" != "null"
          test -n "$CLIENT_IMAGE" && test "$CLIENT_IMAGE" != "null"
          test "$SERVER_IMAGE" != "$BEFORE_SERVER"
          test "$CLIENT_IMAGE" != "$BEFORE_CLIENT"
      
          echo "server_image=$SERVER_IMAGE" >> "$GITHUB_OUTPUT"
          echo "client_image=$CLIENT_IMAGE" >> "$GITHUB_OUTPUT"
      
          echo "SERVER_IMAGE=$SERVER_IMAGE"
          echo "CLIENT_IMAGE=$CLIENT_IMAGE"


      - name: Create containers.json
        run: |
          cat > containers.json <<EOF
          {
            "client": {
              "image": "${{ steps.resolve_images.outputs.client_image }}",
              "command": [],
              "ports": {
                "80": "HTTP"
              },
              "environment": {
                "API_PROXY_PASS": "http://localhost:3000"
              }
            },
            "server": {
              "image": "${{ steps.resolve_images.outputs.server_image }}",
              "ports": {
                "3000": "HTTP"
              },
              "environment": {
                "NODE_ENV": "production",
                "PORT": "3000",
                "DATABASE_URL": "${{ secrets.DATABASE_URL }}",
                "TOKEN_KEY": "${{ secrets.TOKEN_KEY }}",
                "TOKEN_EXPIRES_IN": "${{ vars.TOKEN_EXPIRES_IN }}",
                "PASSWORD_COST": "${{ secrets.PASSWORD_COST }}",
                "TRPC_ROUTE": "${{ secrets.TRPC_ROUTE }}",
                "COOKIE_NAME": "${{ secrets.COOKIE_NAME }}"
              }
            }
          }
          EOF

      - name: Create public-endpoint.json
        run: |
          cat > public-endpoint.json <<EOF
          {
            "containerName": "client",
            "containerPort": 80,
            "healthCheck": {
              "intervalSeconds": 15,
              "path": "/",
              "successCodes": "200-499"
            }
          }
          EOF

      - name: Show containers.json
        run: cat containers.json

      - name: Deploy to Lightsail
        run: |
          aws lightsail create-container-service-deployment \
            --region ${{vars.AWS_REGION}} \
            --service-name ${{vars.AWS_LIGHTSAIL_SERVICE}} \
            --containers file://containers.json \
            --public-endpoint file://public-endpoint.json